<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney's Wedding — #TaylorMadeForHendrix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Sunday, April 25, 2027</div>
    <h1>Sydney's Wedding</h1>
    <p>Everything for the bridal party, all in one place.</p>
    <p style="margin-top:8px;font-weight:700;color:var(--sage-deep);letter-spacing:0.3px;">#TaylorMadeForHendrix</p>
  </div>

  <div class="countdown" id="countdown"></div>

  <div class="nav">
    <button id="tabInfoBtn" class="active">Wedding Info</button>
    <button id="tabFormBtn">Submit My Info</button>
  </div>

  <div id="infoView"></div>
  <div id="formView" style="display:none;"></div>

  <a class="private-link" href="moh.html">MOH & Bride Team login →</a>
</div>

<script>
// ====== SETUP (do this before publishing) ======
// 1. Go to formspree.io, create a free account, create a new form.
// 2. Copy the endpoint it gives you (looks like "https://formspree.io/f/abc1234").
// 3. Paste it below, replacing the placeholder.
// 4. Submissions will show up in your Formspree dashboard (and email, if enabled).
const FORMSPREE_ENDPOINT = "https://formspree.io/f/https://formspree.io/f/mgaednny";
// =================================================

const NAMES = ["Kelyne","Kristian","Savanna","Mayah","Renita","Gabby","Cassie","Zellie","Other / not listed"];
const DATES = [
  {k:"apr15",l:"Apr 15"},{k:"apr16",l:"Apr 16"},{k:"apr17",l:"Apr 17"},
  {k:"apr18",l:"Apr 18"},{k:"apr19",l:"Apr 19"},{k:"apr20",l:"Apr 20"},
  {k:"apr21",l:"Apr 21"},{k:"apr22",l:"Apr 22"},{k:"apr23",l:"Apr 23"}
];
let selectedDates = new Set();

const ROSTER = [
  {name:"Kelyne", role:"Matron of Honor"},
  {name:"Kristian", role:"Matron of Honor"},
  {name:"Savanna", role:"Bridesmaid"},
  {name:"Mayah", role:"Bridesmaid"},
  {name:"Renita", role:"Bridesmaid"},
  {name:"Gabby", role:"Bridesmaid"},
  {name:"Cassie", role:"Bridesmaid"},
  {name:"Zellie", role:"Jr. Bridesmaid"}
];

const FAQS = [
  {q:"What shoes/jewelry should I wear?", a:"Details TBD — check back here once finalized, or ask your Matrons of Honor."},
  {q:"Can I bring a plus-one to the bridal shower?", a:"Not unless specifically invited — the shower guest list is being managed separately from the wedding guest list."},
  {q:"What should I bring on the wedding day?", a:"Comfortable flats for getting ready, any touch-up makeup you personally use, and a phone charger. An emergency kit will be provided, so no need to pack your own."},
  {q:"Is there a dress code for the bachelorette?", a:"Nothing formal required — more details will be shared once the trip is booked."},
  {q:"Who do I contact with questions?", a:"Reach out to Kelyne or Kristian directly rather than the bride — that's exactly what we're here for."},
  {q:"Is there a wedding hashtag?", a:"Yes — tag your photos and posts with #TaylorMadeForHendrix so everyone can find them in one place."}
];

function renderCountdown(){
  const wedding = new Date("2027-04-25T00:00:00");
  const now = new Date();
  const diffMs = wedding - now;
  const el = document.getElementById("countdown");
  if(diffMs <= 0){
    el.innerHTML = '<div class="unit"><span class="num">🎉</span><span class="lbl">It\'s the big day!</span></div>';
    return;
  }
  const days = Math.floor(diffMs / (1000*60*60*24));
  const months = Math.floor(days / 30.44);
  const remDays = Math.floor(days - months*30.44);
  el.innerHTML = `
    <div class="unit"><span class="num">${months}</span><span class="lbl">Months</span></div>
    <div class="unit"><span class="num">${remDays}</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num">${days}</span><span class="lbl">Total Days</span></div>
  `;
}

function renderInfo(){
  document.getElementById("infoView").innerHTML = `
    <div class="card">
      <span class="badge">Ceremony & Reception</span>
      <h2>Monarcas Reception Hall</h2>
      <p class="sub">8040 N 43rd Ave, Glendale, AZ</p>
      <div class="info-row"><span class="label">Ceremony</span><span class="value">4:00 PM</span></div>
      <div class="info-row"><span class="label">Cocktail Hour</span><span class="value">4:45 PM</span></div>
      <div class="info-row"><span class="label">Dinner</span><span class="value">5:30 PM</span></div>
    </div>

    <div class="card">
      <h2>Bridal Party</h2>
      <p class="sub">Who's who for the big day.</p>
      <div class="roster-grid">
        ${ROSTER.map(r => `
          <div class="roster-item">
            <div class="name">${r.name}</div>
            <div class="role">${r.role}</div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="card">
      <h2>Bridesmaid Attire</h2>
      <div class="info-row"><span class="label">Color</span><span class="value">Dusty Sage</span></div>
      <div class="info-row"><span class="label">Style</span><span class="value">Long / full length</span></div>
      <div class="info-row"><span class="label">Material</span><span class="value">Chiffon or satin</span></div>
      <div class="info-row"><span class="label">Vendors</span><span class="value">Birdy Grey, Azazie, David's Bridal</span></div>
      <div class="info-row"><span class="label">Order deadline</span><span class="value" style="color:#9C4A3A;font-weight:700;">March 1, 2027</span></div>
    </div>

    <div class="card">
      <h2>Bachelorette</h2>
      <div class="info-row"><span class="label">Date range</span><span class="value">Apr 15–23, 2027</span></div>
      <div class="info-row"><span class="label">Payment methods</span><span class="value">Zelle, Cash App, Apple Pay</span></div>
      <p class="sub" style="margin-top:12px;">Use the "Submit My Info" tab to let us know which dates in that range work for you.</p>
    </div>

    <div class="card">
      <h2>Registry</h2>
      <p class="sub">Link will be added here once available.</p>
    </div>

    <div class="card">
      <h2>FAQ</h2>
      ${FAQS.map((f,i) => `
        <div class="faq-item">
          <div class="faq-q" data-idx="${i}">${f.q}<span class="arrow">▾</span></div>
          <div class="faq-a" data-idx="${i}">${f.a}</div>
        </div>
      `).join("")}
    </div>

    <div class="footer-note">Questions about anything above? Reach out to your Matrons of Honor.</div>
  `;

  document.querySelectorAll(".faq-q").forEach(el => {
    el.onclick = () => {
      const idx = el.dataset.idx;
      el.classList.toggle("open");
      document.querySelector(`.faq-a[data-idx="${idx}"]`).classList.toggle("open");
    };
  });
}

function renderForm(){
  selectedDates = new Set();
  const nameOptions = NAMES.map(n => `<option value="${n}">${n}</option>`).join("");
  document.getElementById("formView").innerHTML = `
    <div class="card">
      <h2>Who you are</h2>
      <p class="sub">Pick your name, or choose "Other" if you're not on the list yet.</p>
      <label for="fName">Name</label>
      <select id="fName">
        <option value="">Select your name</option>
        ${nameOptions}
      </select>
      <div id="otherNameWrap" style="display:none;">
        <label for="fOtherName">Your name</label>
        <input type="text" id="fOtherName" placeholder="First and last name">
      </div>
      <label for="fPhone">Phone number</label>
      <input type="tel" id="fPhone" placeholder="(555) 123-4567">
    </div>

    <div class="card">
      <h2>Dress details</h2>
      <p class="sub">Dusty sage, long/full length, chiffon or satin — ordered by March 1, 2027.</p>
      <label for="fSize">Dress size</label>
      <input type="text" id="fSize" placeholder="e.g. 8, or bust/waist/hip if between sizes">
      <label for="fHeight">Height</label>
      <input type="text" id="fHeight" placeholder="e.g. 5'6&quot;">
    </div>

    <div class="card">
      <h2>Bachelorette availability</h2>
      <p class="sub">Tap every date you're free between April 15–23, 2027.</p>
      <div class="dates" id="datesGrid"></div>
    </div>

    <div class="card">
      <h2>Anything else</h2>
      <label for="fDiet">Dietary restrictions or allergies</label>
      <textarea id="fDiet" placeholder="e.g. gluten-free, shellfish allergy, vegetarian — or leave blank"></textarea>
      <label for="fNotes">Anything else your MOHs should know</label>
      <textarea id="fNotes" placeholder="Optional"></textarea>
    </div>

    <div id="formError"></div>
    <button class="submit-btn" id="submitBtn">Send my info</button>
  `;

  const grid = document.getElementById("datesGrid");
  DATES.forEach(d => {
    const chip = document.createElement("div");
    chip.className = "date-chip";
    chip.textContent = d.l;
    chip.onclick = () => {
      if(selectedDates.has(d.k)){ selectedDates.delete(d.k); chip.classList.remove("selected"); }
      else{ selectedDates.add(d.k); chip.classList.add("selected"); }
    };
    grid.appendChild(chip);
  });

  document.getElementById("fName").onchange = (e) => {
    document.getElementById("otherNameWrap").style.display =
      e.target.value === "Other / not listed" ? "block" : "none";
  };

  document.getElementById("submitBtn").onclick = submitForm;
}

async function submitForm(){
  const errEl = document.getElementById("formError");
  errEl.innerHTML = "";
  let name = document.getElementById("fName").value;
  if(name === "Other / not listed"){
    name = document.getElementById("fOtherName").value.trim();
  }
  const phone = document.getElementById("fPhone").value.trim();
  const size = document.getElementById("fSize").value.trim();
  const height = document.getElementById("fHeight").value.trim();
  const diet = document.getElementById("fDiet").value.trim();
  const notes = document.getElementById("fNotes").value.trim();

  if(!name){
    errEl.innerHTML = '<div class="error">Please enter or select your name.</div>';
    return;
  }
  if(!size || !height){
    errEl.innerHTML = '<div class="error">Dress size and height are needed for ordering — please fill both in.</div>';
    return;
  }

  const dateLabelMap = Object.fromEntries(DATES.map(d => [d.k, d.l]));
  const record = {
    Name: name,
    Phone: phone,
    "Dress Size": size,
    Height: height,
    "Available Dates": Array.from(selectedDates).map(k => dateLabelMap[k] || k).join(", ") || "none selected",
    "Diet/Allergies": diet || "none",
    Notes: notes || "none"
  };

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending...";

  if(FORMSPREE_ENDPOINT.includes("https://formspree.io/f/mgaednny")){
    errEl.innerHTML = '<div class="error">This form isn\'t connected yet — add your Formspree endpoint at the top of the script before publishing.</div>';
    btn.disabled = false;
    btn.textContent = "Send my info";
    return;
  }

  try{
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(record)
    });
    if(!res.ok){
      errEl.innerHTML = '<div class="error">Something went wrong saving your info. Please try again.</div>';
      btn.disabled = false;
      btn.textContent = "Send my info";
      return;
    }
    renderThankYou(name);
  }catch(e){
    errEl.innerHTML = '<div class="error">Something went wrong saving your info. Please check your connection and try again.</div>';
    btn.disabled = false;
    btn.textContent = "Send my info";
  }
}

function renderThankYou(name){
  document.getElementById("formView").innerHTML = `
    <div class="card msg">
      <div class="check">✓</div>
      <h2>Thanks, ${name.split(" ")[0]}!</h2>
      <p>Your info is in. Your Matrons of Honor have what they need — no need to text it separately.</p>
      <div class="edit-link" id="editAgainLink">Need to change something? Fill it out again</div>
    </div>
  `;
  document.getElementById("editAgainLink").onclick = () => renderForm();
}

document.getElementById("tabInfoBtn").onclick = () => {
  document.getElementById("tabInfoBtn").classList.add("active");
  document.getElementById("tabFormBtn").classList.remove("active");
  document.getElementById("infoView").style.display = "block";
  document.getElementById("formView").style.display = "none";
};
document.getElementById("tabFormBtn").onclick = () => {
  document.getElementById("tabFormBtn").classList.add("active");
  document.getElementById("tabInfoBtn").classList.remove("active");
  document.getElementById("formView").style.display = "block";
  document.getElementById("infoView").style.display = "none";
};

renderCountdown();
renderInfo();
renderForm();
</script>
</body>
</html>
